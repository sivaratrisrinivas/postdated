<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POSTDATED prototype — minimal work list</title>
  <style>
    :root {
      --ink: #15201c;
      --muted: #63706a;
      --line: #dce2de;
      --paper: #fffefa;
      --wash: #f4f6f4;
      --green: #176648;
      --green-soft: #e8f3ed;
      --red: #a4453d;
      --red-soft: #faece9;
      --blue: #315f7b;
      --blue-soft: #eaf1f5;
      --amber: #805718;
      --amber-soft: #fff4da;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eef1ef;
      color: var(--ink);
      font-family: Aptos, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      line-height: 1.45;
    }
    button, summary { font: inherit; }
    button:focus-visible, summary:focus-visible { outline: 3px solid #77a4be; outline-offset: 2px; }
    button { cursor: pointer; }
    .appbar {
      min-height: 58px;
      padding: 12px max(18px, calc((100vw - 980px) / 2));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: #173e32;
      color: white;
    }
    .brand { font-size: 13px; font-weight: 850; letter-spacing: .13em; }
    .session { display: flex; align-items: center; gap: 9px; min-width: 0; font-size: 13px; color: #d4e2dc; }
    .avatar { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #e8f3ed; color: var(--green); font-size: 11px; font-weight: 850; }
    .prototype { color: #a9c0b7; font-size: 11px; }
    main { width: min(920px, calc(100% - 28px)); margin: 26px auto 130px; }
    .case-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); line-height: 1.12; letter-spacing: -.03em; }
    h2, h3, p { margin-top: 0; }
    h2 { margin-bottom: 3px; font-size: 18px; letter-spacing: -.015em; }
    h3 { margin-bottom: 3px; font-size: 15px; }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; background: #e1e6e3; color: #4f5c56; padding: 5px 9px; font-size: 11px; font-weight: 750; }
    .chip.good { background: var(--green-soft); color: var(--green); }
    .chip.red { background: var(--red-soft); color: var(--red); }
    .chip.blue { background: var(--blue-soft); color: var(--blue); }
    .chip.amber { background: var(--amber-soft); color: var(--amber); }
    .summary { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; padding: 14px 0; border-block: 1px solid var(--line); margin-bottom: 18px; }
    .summary b { font-size: 14px; }
    .summary span { color: var(--muted); font-size: 13px; }
    .notice { padding: 11px 13px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; }
    .notice.good { color: var(--green); background: var(--green-soft); }
    .notice.bad { color: var(--red); background: var(--red-soft); }
    .notice.info { color: var(--blue); background: var(--blue-soft); }
    .stack { display: grid; gap: 10px; }
    .row {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
    }
    .row-top { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: start; }
    .row-title { font-weight: 780; font-size: 15px; }
    .row-copy { color: var(--muted); font-size: 13px; margin: 5px 0 0; max-width: 66ch; }
    .amount { font-size: 15px; font-weight: 850; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 13px; }
    .btn { border: 1px solid var(--line); background: white; color: var(--ink); border-radius: 9px; padding: 8px 11px; font-size: 13px; font-weight: 730; }
    .btn:hover { border-color: #9fa9a4; }
    .btn.primary { color: white; background: var(--green); border-color: var(--green); }
    .btn.quiet { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 4px; }
    .btn.danger { color: var(--red); border-color: #dcb6b1; }
    details.why { margin-top: 13px; border-top: 1px solid var(--line); padding-top: 11px; }
    details.why summary { color: var(--muted); font-size: 12px; font-weight: 750; cursor: pointer; list-style: none; }
    details.why summary::-webkit-details-marker { display: none; }
    details.why summary::after { content: " +"; }
    details.why[open] summary::after { content: " −"; }
    .proof { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .proof div { min-width: 0; }
    .proof b { display: block; color: var(--muted); margin-bottom: 3px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    .proof span { font-size: 12px; }
    .deductions { margin-top: 14px; }
    .deductions > summary { display: flex; justify-content: space-between; gap: 18px; padding: 13px 0; border-block: 1px solid var(--line); cursor: pointer; font-weight: 760; list-style: none; }
    .deductions > summary::-webkit-details-marker { display: none; }
    .deduction-list { padding: 12px 0 2px; display: grid; gap: 8px; }
    .deduction { display: grid; grid-template-columns: 1fr auto; gap: 18px; color: var(--muted); font-size: 13px; }
    .deduction b { color: var(--ink); }
    .evidence-update { padding: 15px 16px; margin-bottom: 16px; border: 1px solid #9abaaa; border-radius: var(--radius); background: #f5fbf7; }
    .evidence-update h2 { color: var(--green); }
    .diffline { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-top: 11px; font-size: 13px; }
    .diffline > div { padding: 10px; border-radius: 9px; background: white; border: 1px solid var(--line); }
    .diffline .new { border-color: #9abaaa; }
    .letter-link { display: flex; justify-content: space-between; width: 100%; margin-top: 16px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 13px; }
    .empty { text-align: center; padding: 70px 20px; color: var(--muted); }
    .empty h2 { color: var(--ink); font-size: 23px; }

    /* Variant B: one decision at a time. */
    .focus-shell { width: min(670px, 100%); margin: 0 auto; }
    .focus-count { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .focus-card { background: var(--paper); border-radius: 18px; padding: clamp(22px, 5vw, 38px); box-shadow: 0 18px 45px rgba(21,32,28,.09); }
    .focus-card .row-title { font-size: clamp(23px, 4vw, 32px); letter-spacing: -.03em; line-height: 1.15; }
    .focus-card .amount { font-size: 20px; margin-top: 20px; }
    .focus-card .proof { grid-template-columns: 1fr; border-top: 1px solid var(--line); padding-top: 14px; }
    .queue { margin-top: 14px; border-top: 1px solid var(--line); }
    .queue-item { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .queue-item span { color: var(--muted); }

    /* Variant C: evidence ledger. */
    .ledger { border-block: 1px solid var(--line); }
    .ledger-row { display: grid; grid-template-columns: 170px 1fr 150px; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: start; }
    .ledger-row:last-child { border: 0; }
    .ledger-source { color: var(--muted); font-size: 12px; }
    .ledger-result { text-align: right; }
    .ledger-result .amount { display: block; margin-bottom: 6px; }

    .prototype-panel { margin-top: 26px; }
    .prototype-panel > summary { color: var(--muted); font-size: 12px; cursor: pointer; }
    .controls { display: flex; flex-wrap: wrap; gap: 7px; padding-top: 12px; }
    .state-line { width: 100%; color: var(--muted); font-size: 11px; margin-top: 4px; }
    .switcher {
      position: fixed;
      z-index: 20;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 38px minmax(150px, auto) 38px;
      align-items: center;
      padding: 5px;
      border-radius: 999px;
      background: #14231e;
      color: white;
      box-shadow: 0 12px 30px rgba(0,0,0,.2);
    }
    .switcher button { width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: white; font-size: 18px; }
    .switcher button:hover { background: rgba(255,255,255,.1); }
    .variant-name { padding: 0 12px; text-align: center; font-size: 12px; font-weight: 760; white-space: nowrap; }
    dialog { width: min(640px, calc(100% - 28px)); border: 0; border-radius: 16px; padding: 0; box-shadow: 0 30px 80px rgba(0,0,0,.28); }
    dialog::backdrop { background: rgba(12,22,18,.58); }
    .dialog-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: start; gap: 20px; }
    .dialog-body { padding: 20px; }
    .close { border: 0; background: transparent; color: var(--muted); font-size: 22px; }
    .languages { display: flex; gap: 6px; margin-bottom: 16px; }
    .ask { padding: 20px; background: var(--wash); border-radius: 12px; font-size: clamp(21px, 4vw, 28px); font-weight: 700; line-height: 1.48; }
    .letter { border: 1px solid #bbb; background: white; padding: 24px; font-family: Georgia, serif; }
    .simulation { display: inline-block; border: 2px solid var(--red); color: var(--red); padding: 5px 8px; margin-bottom: 15px; font-family: ui-sans-serif, system-ui; font-size: 11px; font-weight: 850; }
    @media (max-width: 700px) {
      .prototype { display: none; }
      .case-head { display: block; }
      .case-head > .chip { margin-top: 14px; }
      .proof, .ledger-row { grid-template-columns: 1fr; }
      .ledger-result { text-align: left; }
      .diffline { grid-template-columns: 1fr; }
      .diffline > span { text-align: center; transform: rotate(90deg); }
      .switcher { bottom: 12px; }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="brand">POSTDATED</div>
    <div class="session"><span class="prototype">Prototype · issue #6</span><span class="avatar">AR</span><span>Ananya Rao</span></div>
  </header>
  <main id="app"></main>

  <nav class="switcher" aria-label="Prototype variants">
    <button id="prev-variant" aria-label="Previous variant">←</button>
    <div class="variant-name" id="variant-name"></div>
    <button id="next-variant" aria-label="Next variant">→</button>
  </nav>

  <dialog id="ask-dialog" aria-labelledby="ask-heading">
    <div class="dialog-head"><div><h2 id="ask-heading">Ask sheet</h2><p class="sub">Show this to the nursing station.</p></div><button class="close" data-close="ask-dialog" aria-label="Close ask sheet">×</button></div>
    <div class="dialog-body" id="ask-body"></div>
  </dialog>
  <dialog id="letter-dialog" aria-labelledby="letter-heading">
    <div class="dialog-head"><div><h2 id="letter-heading">Simulated future letter</h2><p class="sub">Secondary explanation · not a claim decision.</p></div><button class="close" data-close="letter-dialog" aria-label="Close simulated letter">×</button></div>
    <div class="dialog-body" id="letter-body"></div>
  </dialog>

  <script>
    // Three structurally different minimal variants on one route: ?variant=A|B|C.
    const variants = {
      A: 'A — Action queue',
      B: 'B — One decision',
      C: 'C — Evidence ledger'
    };
    const variantKeys = Object.keys(variants);
    let variant = new URLSearchParams(location.search).get('variant')?.toUpperCase();
    if (!variantKeys.includes(variant)) variant = 'A';

    const initial = () => ({
      step: 4,
      corrected: null,
      reviewSent: false,
      complete: false,
      askLanguage: 'en',
      lastChange: 'Work list created from the original discharge summary and bill.',
      tone: 'info'
    });
    let state = initial();

    const risk = {
      title: 'Collect the indoor case papers',
      amount: 84000,
      why: 'The day-by-day ward record is missing, so the payer may treat four charge groups as unsupported.',
      evidence: 'Original upload: discharge summary and final bill only. No ward record found.',
      rule: 'Verified Niva Bupa claim-document rule: medical records must support claimed hospital charges.',
      calculation: '₹12,000 nursing + ₹30,000 doctor fees + ₹14,000 theatre + ₹28,000 diagnostics = ₹84,000.',
      asks: {
        en: 'Please provide the signed indoor case papers — the day-by-day ward record — for this admission.',
        kn: 'ದಯವಿಟ್ಟು ಈ ದಾಖಲಾತಿಗೆ ಸಹಿ ಮಾಡಿದ ದಿನನಿತ್ಯದ ವಾರ್ಡ್ ದಾಖಲೆಗಳನ್ನು (Indoor Case Papers) ನೀಡಿ.',
        hi: 'कृपया इस भर्ती के हस्ताक्षर किए हुए रोज़ के वार्ड रिकॉर्ड (Indoor Case Papers) दें।'
      }
    };
    const review = {
      title: 'Reason for inpatient admission is unclear',
      why: 'Only the treating doctor can answer. POSTDATED does not write or suggest the clinical reason.',
      evidence: 'Original summary: “Post-operative period uneventful.” No reason for inpatient admission is stated.',
      rule: 'Verified Niva Bupa ReAssure 2.0 §4.2.1 hospitalization conditions.',
      calculation: 'No reliable rupee result. Needs human review.'
    };

    const derived = () => ({
      analysed: state.step >= 4,
      asked: state.step >= 5,
      riskCleared: state.corrected === 'fixed',
      reviewSent: state.reviewSent,
      open: state.corrected === 'fixed' ? 0 : 1,
      canComplete: state.corrected === 'fixed' && state.reviewSent && !state.complete,
      version: state.corrected ? 2 : 1
    });

    function dispatch(action) {
      const d = derived();
      const good = message => Object.assign(state, { lastChange: message, tone: 'good' });
      const bad = message => Object.assign(state, { lastChange: message, tone: 'bad' });
      switch (action) {
        case 'reset': state = initial(); break;
        case 'start': state = { ...initial(), step: -1, lastChange: 'Ready to open the case.', tone: 'info' }; break;
        case 'next': advance(); return;
        case 'ask':
          if (!d.analysed) return bad('Create the work list first.'), render();
          state.step = Math.max(state.step, 5); good('Ask sheet opened. No warning status changed.'); render(); openAsk(); return;
        case 'fixed':
          if (!d.analysed) return bad('Create the work list first.'), render();
          state.step = Math.max(state.step, 6); state.corrected = 'fixed';
          good('Evidence v2 adds the signed indoor case papers. The document warning cleared.'); break;
        case 'unchanged':
          if (!d.analysed) return bad('Create the work list first.'), render();
          state.step = Math.max(state.step, 6); state.corrected = 'unchanged';
          good('Evidence v2 contains no relevant change. The warning remains open.'); break;
        case 'review':
          if (state.corrected !== 'fixed') return bad('Upload the doctor-signed evidence before routing it for review.'), render();
          state.step = Math.max(state.step, 7); state.reviewSent = true;
          good('Sent to Priya Menon. It still says needs human review; it is not marked fixed.'); break;
        case 'complete':
          if (!d.canComplete) return bad('Cannot complete: collect the missing document and route uncertainty for human review.'), render();
          state.step = 8; state.complete = true; good('Desk case complete. Human review remains visible and routed.'); break;
      }
      render();
    }

    function advance() {
      const sequence = [
        'Ananya opened case PD-4471.',
        'Selected the verified Niva Bupa policy.',
        'Uploaded the discharge summary.',
        'Uploaded the itemised final bill.',
        'Work list created from evidence v1.'
      ];
      if (state.step < 4) {
        state.step += 1;
        state.lastChange = sequence[state.step]; state.tone = 'good'; render(); return;
      }
      if (state.step === 4) return dispatch('ask');
      if (!state.corrected) return dispatch('fixed');
      if (!state.reviewSent) return dispatch('review');
      return dispatch('complete');
    }

    function header(d) {
      if (!d.analysed) return `<section class="empty"><h2>${stageTitle()}</h2><p>${state.lastChange}</p><button class="btn primary" data-action="next">${nextLabel()}</button></section>`;
      return `<header class="case-head"><div><h1>Ramachandra P. · discharge today</h1><p class="sub">Case PD-4471 · Krishna Multispeciality Hospital</p><div class="meta"><span class="chip good">Niva Bupa · verified</span><span class="chip">Discharge summary</span><span class="chip">Itemised bill</span><span class="chip">Evidence v${d.version}</span></div></div>${state.complete ? '<span class="chip good">Desk case complete</span>' : '<span class="chip amber">40 minutes left</span>'}</header>`;
    }

    function commonSummary(d) {
      return `${state.lastChange ? `<div class="notice ${state.tone}" aria-live="polite">${esc(state.lastChange)}</div>` : ''}<div class="summary"><b>${d.open} document task${d.open === 1 ? '' : 's'}</b><span>1 needs human review</span><span>₹48,000 unavoidable</span></div>${state.corrected ? evidenceUpdate(d) : ''}`;
    }

    function variantA(d) {
      return `${header(d)}${d.analysed ? `${commonSummary(d)}<section class="stack" aria-label="Work list">${documentRow(d)}${reviewRow(d)}</section>${deductions()}${letterLink()}${reviewControls(d)}` : ''}`;
    }

    function variantB(d) {
      if (!d.analysed) return header(d);
      const focus = d.riskCleared ? reviewFocus(d) : documentFocus(d);
      return `${header(d)}<div class="focus-shell">${state.lastChange ? `<div class="notice ${state.tone}" aria-live="polite">${esc(state.lastChange)}</div>` : ''}<p class="focus-count">${d.riskCleared ? 'Next decision' : 'First of 2 decisions'}</p>${focus}<div class="queue"><div class="queue-item"><div><b>Policy deductions</b><br><span>No action can change these now</span></div><b>₹48,000</b></div>${d.riskCleared ? '<div class="queue-item"><div><b>Indoor case papers</b><br><span>Cleared by evidence v2</span></div><span class="chip good">Cleared</span></div>' : '<div class="queue-item"><div><b>Reason for admission</b><br><span>Needs human review</span></div><span class="chip blue">Review</span></div>'}</div>${letterLink()}${reviewControls(d)}</div>`;
    }

    function variantC(d) {
      if (!d.analysed) return header(d);
      return `${header(d)}${commonSummary(d)}<section class="ledger" aria-label="Evidence ledger">
        <article class="ledger-row"><div class="ledger-source"><b>Missing document</b><br>Discharge packet</div><div><h3>${risk.title}</h3><p class="sub">${risk.why}</p>${why(risk)}<div class="row-actions"><button class="btn" data-action="ask">Open ask sheet</button></div></div><div class="ledger-result"><span class="amount">₹84,000</span>${d.riskCleared ? '<span class="chip good">Cleared by v2</span>' : '<span class="chip red">Action needed</span>'}</div></article>
        <article class="ledger-row"><div class="ledger-source"><b>Clinical evidence</b><br>Discharge summary</div><div><h3>${review.title}</h3><p class="sub">${review.why}</p>${why(review)}</div><div class="ledger-result"><span class="amount">Not calculated</span><span class="chip blue">${d.reviewSent ? 'Sent to Priya' : 'Needs review'}</span></div></article>
        <article class="ledger-row"><div class="ledger-source"><b>Policy terms</b><br>Final bill</div><div><h3>Room and consumables</h3><p class="sub">Already incurred. No discharge-desk action can change them.</p></div><div class="ledger-result"><span class="amount">₹48,000</span><span class="chip">Unavoidable</span></div></article>
      </section>${letterLink()}${reviewControls(d)}`;
    }

    function documentRow(d) {
      return `<article class="row"><div class="row-top"><div><div class="row-title">${risk.title}</div><p class="row-copy">${risk.why}</p></div><div><div class="amount">₹84,000</div><span class="chip ${d.riskCleared ? 'good' : 'red'}">${d.riskCleared ? 'Cleared by v2' : 'Action needed'}</span></div></div><div class="row-actions"><button class="btn primary" data-action="ask">Open ask sheet</button></div>${why(risk)}</article>`;
    }
    function reviewRow(d) {
      return `<article class="row"><div class="row-top"><div><div class="row-title">${review.title}</div><p class="row-copy">${review.why}</p></div><div><div class="amount">Not calculated</div><span class="chip blue">${d.reviewSent ? 'Sent to Priya' : 'Needs human review'}</span></div></div>${why(review)}</article>`;
    }
    function documentFocus(d) {
      return `<article class="focus-card"><span class="chip red">Action needed</span><div class="row-title" style="margin-top:14px">${risk.title}</div><p class="row-copy">${risk.why}</p><div class="amount">₹84,000 at risk</div><div class="row-actions"><button class="btn primary" data-action="ask">Open ask sheet</button></div>${why(risk)}</article>`;
    }
    function reviewFocus(d) {
      return `<article class="focus-card"><span class="chip blue">${d.reviewSent ? 'Sent to Priya · needs review' : 'Needs human review'}</span><div class="row-title" style="margin-top:14px">${review.title}</div><p class="row-copy">${review.why}</p><div class="amount">No rupee result</div>${why(review)}${!d.reviewSent ? '<div class="row-actions"><button class="btn primary" data-action="review">Send to Priya</button></div>' : d.canComplete ? '<div class="row-actions"><button class="btn primary" data-action="complete">Complete desk case</button></div>' : ''}</article>`;
    }
    function why(item) {
      return `<details class="why"><summary>Why this appears</summary><div class="proof"><div><b>Evidence</b><span>${esc(item.evidence)}</span></div><div><b>Verified rule</b><span>${esc(item.rule)}</span></div><div><b>Calculation</b><span>${esc(item.calculation)}</span></div></div></details>`;
    }
    function deductions() {
      return `<details class="deductions"><summary><span>Unavoidable policy deductions</span><span>₹48,000</span></summary><div class="deduction-list"><div class="deduction"><span><b>Room category</b> · room excess and proportionate deduction</span><b>₹33,000</b></div><div class="deduction"><span><b>Non-payable consumables</b> · gloves, PPE and syringes</span><b>₹15,000</b></div></div></details>`;
    }
    function evidenceUpdate(d) {
      const fixed = state.corrected === 'fixed';
      return `<section class="evidence-update"><h2>${fixed ? 'New evidence fixed one warning' : 'No evidence changed'}</h2><p class="sub">${fixed ? 'The signed indoor case papers are present. The doctor-signed answer still needs human review.' : 'The filename changed, but the required pages are still missing. Nothing cleared.'}</p><div class="diffline"><div>v1 · indoor papers absent</div><span>→</span><div class="new">v2 · ${fixed ? 'signed pages present' : 'still absent'}</div></div></section>`;
    }
    function letterLink() {
      return `<button class="btn quiet letter-link" data-letter><span>Simulated future letter</span><span>Secondary view →</span></button>`;
    }
    function reviewControls(d) {
      return `<details class="prototype-panel"><summary>Prototype controls</summary><div class="controls"><button class="btn" data-action="start">Restart full journey</button><button class="btn primary" data-action="next">${nextLabel()}</button><button class="btn" data-action="fixed">Upload corrected evidence</button><button class="btn" data-action="unchanged">Upload unchanged evidence</button><button class="btn" data-action="review">Send for human review</button><button class="btn" data-action="complete">Complete case</button><span class="state-line">State: step ${state.step} · evidence v${d.version} · ${d.open} open · review ${d.reviewSent ? 'routed' : 'not routed'} · ${state.complete ? 'complete' : 'in progress'}</span></div></details>`;
    }
    function stageTitle() { return ['Open case PD-4471', 'Choose the verified policy', 'Upload discharge summary', 'Upload itemised final bill', 'Create work list'][state.step + 1] || 'Create work list'; }
    function nextLabel() {
      if (state.step < 4) return stageTitle();
      if (state.step === 4) return 'Open ask sheet';
      if (!state.corrected) return 'Upload corrected evidence';
      if (!state.reviewSent) return 'Send for human review';
      if (!state.complete) return 'Complete case';
      return 'Case complete';
    }

    function openAsk() { renderAsk(); document.getElementById('ask-dialog').showModal(); }
    function renderAsk() {
      const names = { en: 'English', kn: 'ಕನ್ನಡ', hi: 'हिन्दी' };
      const root = document.getElementById('ask-body');
      root.innerHTML = `<div class="languages">${Object.entries(names).map(([code,name]) => `<button class="btn ${state.askLanguage === code ? 'primary' : ''}" data-lang="${code}">${name}</button>`).join('')}</div><div class="ask" lang="${state.askLanguage}">${risk.asks[state.askLanguage]}</div><p class="sub" style="margin-top:13px">Showing this sheet does not change the warning. Only new evidence can clear it.</p>`;
      root.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => { state.askLanguage = button.dataset.lang; renderAsk(); }));
    }
    function renderLetter(d) {
      const exposure = 48000 + (d.riskCleared ? 0 : 84000);
      document.getElementById('letter-body').innerHTML = `<div class="letter"><div class="simulation">SIMULATION · NOT ISSUED BY NIVA BUPA</div><h2>Possible future deductions</h2><p style="font-size:28px;color:var(--red);font-weight:800">₹${exposure.toLocaleString('en-IN')}</p><p>This explains the current work list. It is not a real letter, promise, or calibrated claim outcome.</p></div>`;
    }
    function render() {
      const d = derived();
      const content = variant === 'A' ? variantA(d) : variant === 'B' ? variantB(d) : variantC(d);
      document.getElementById('app').innerHTML = content;
      document.getElementById('variant-name').textContent = variants[variant];
      document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => dispatch(button.dataset.action)));
      document.querySelectorAll('[data-letter]').forEach(button => button.addEventListener('click', () => { renderLetter(d); document.getElementById('letter-dialog').showModal(); }));
    }
    function switchVariant(direction) {
      const next = (variantKeys.indexOf(variant) + direction + variantKeys.length) % variantKeys.length;
      variant = variantKeys[next];
      const url = new URL(location.href); url.searchParams.set('variant', variant); history.replaceState({}, '', url);
      render();
    }
    function esc(value) { return String(value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char])); }

    document.getElementById('prev-variant').addEventListener('click', () => switchVariant(-1));
    document.getElementById('next-variant').addEventListener('click', () => switchVariant(1));
    document.addEventListener('keydown', event => {
      if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
      if (event.key === 'ArrowLeft') switchVariant(-1);
      if (event.key === 'ArrowRight') switchVariant(1);
    });
    document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => document.getElementById(button.dataset.close).close()));
    document.querySelectorAll('dialog').forEach(dialog => dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); }));
    render();
  </script>
</body>
</html>
